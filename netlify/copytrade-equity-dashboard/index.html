<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copytrade c1-c11 盈亏曲线</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #6b7280;
      --line: #d9dee7;
      --panel: #f7f9fc;
      --accent: #0f766e;
      --danger: #b42318;
      --blue: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #ffffff;
    }
    header {
      padding: 24px 28px 12px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    main { padding: 20px 28px 32px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel);
    }
    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .chart-wrap {
      width: 100%;
      min-height: 560px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    svg {
      display: block;
      width: 100%;
      height: 720px;
      background: #fff;
    }
    .axis { stroke: #8b95a5; stroke-width: 1; }
    .grid { stroke: #edf0f5; stroke-width: 1; }
    .series { fill: none; stroke-width: 2.5; }
    .total { stroke-width: 4; }
    text { fill: var(--ink); font-size: 12px; }
    .muted { fill: var(--muted); }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 14px 0;
      font-size: 13px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .swatch {
      width: 22px;
      height: 3px;
      border-radius: 2px;
      display: inline-block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 13px;
    }
    th, td {
      text-align: right;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    .pos { color: var(--accent); }
    .neg { color: var(--danger); }
    @media (max-width: 900px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      svg { height: 560px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Copytrade c1-c11 盈亏曲线</h1>
    <div class="meta" id="meta">Loading...</div>
  </header>
  <main>
    <section class="stats" id="stats"></section>
    <section class="chart-wrap">
      <svg id="chart" viewBox="0 0 1400 760" role="img" aria-label="c1-c11 hourly PnL curve"></svg>
    </section>
    <div class="legend" id="legend"></div>
    <table id="latestTable"></table>
  </main>
  <script>
    const colors = [
      "#0f766e", "#1d4ed8", "#9333ea", "#d97706", "#be123c", "#047857",
      "#7c3aed", "#0369a1", "#c2410c", "#4d7c0f", "#0f172a", "#ef4444"
    ];
    const fmtMoney = (value) => `${Number(value || 0).toFixed(2)}U`;
    const fmtSigned = (value) => `${value >= 0 ? "+" : "-"}${Math.abs(Number(value || 0)).toFixed(2)}U`;
    const cls = (value) => Number(value || 0) >= 0 ? "pos" : "neg";
    const bjTime = (value) => new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai", hour12: false,
      month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
    }).format(new Date(value));

    function pointSeries(history) {
      return history.map((snap) => {
        const accountMap = new Map((snap.accounts || []).map((row) => [row.label, row]));
        return {
          t: new Date(snap.capturedAt).getTime(),
          capturedAt: snap.capturedAt,
          total: snap.summary?.totalPnl || 0,
          accounts: accountMap,
        };
      }).filter((row) => Number.isFinite(row.t)).sort((a, b) => a.t - b.t);
    }

    function pathFor(points, xFor, yFor) {
      return points.map((point, index) => `${index ? "L" : "M"}${xFor(point.x).toFixed(2)},${yFor(point.y).toFixed(2)}`).join(" ");
    }

    function renderChart(history) {
      const svg = document.getElementById("chart");
      svg.textContent = "";
      const series = pointSeries(history);
      const labels = Array.from(new Set(series.flatMap((snap) => Array.from(snap.accounts.keys())))).sort((a, b) => Number(a.slice(1)) - Number(b.slice(1)));
      const left = 78, right = 28, top = 32, bottom = 76, width = 1400, height = 760;
      const chartW = width - left - right;
      const chartH = height - top - bottom;
      const allYs = series.flatMap((snap) => [snap.total, ...labels.map((label) => snap.accounts.get(label)?.pnl).filter(Number.isFinite)]);
      const minY = Math.min(-5, ...allYs);
      const maxY = Math.max(5, ...allYs);
      const padY = Math.max(5, (maxY - minY) * 0.12);
      const yMin = minY - padY;
      const yMax = maxY + padY;
      const xMin = Math.min(...series.map((s) => s.t));
      const xMax = Math.max(...series.map((s) => s.t));
      const xFor = (value) => left + ((value - xMin) / Math.max(1, xMax - xMin)) * chartW;
      const yFor = (value) => top + (1 - ((value - yMin) / Math.max(1, yMax - yMin))) * chartH;
      const add = (name, attrs, parent = svg) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", name);
        for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
        parent.appendChild(el);
        return el;
      };

      for (let i = 0; i <= 6; i += 1) {
        const value = yMin + ((yMax - yMin) * i) / 6;
        const y = yFor(value);
        add("line", { x1: left, y1: y, x2: width - right, y2: y, class: "grid" });
        add("text", { x: left - 10, y: y + 4, "text-anchor": "end", class: "muted" }).textContent = value.toFixed(0);
      }
      if (yMin < 0 && yMax > 0) {
        const y0 = yFor(0);
        add("line", { x1: left, y1: y0, x2: width - right, y2: y0, stroke: "#9ca3af", "stroke-width": 1.5 });
      }
      add("line", { x1: left, y1: top, x2: left, y2: height - bottom, class: "axis" });
      add("line", { x1: left, y1: height - bottom, x2: width - right, y2: height - bottom, class: "axis" });

      const ticks = Math.min(8, series.length);
      for (let i = 0; i < ticks; i += 1) {
        const snap = series[Math.round((series.length - 1) * (i / Math.max(1, ticks - 1)))];
        const x = xFor(snap.t);
        add("line", { x1: x, y1: height - bottom, x2: x, y2: height - bottom + 6, class: "axis" });
        add("text", { x, y: height - bottom + 28, "text-anchor": "middle", class: "muted" }).textContent = bjTime(snap.capturedAt);
      }

      labels.forEach((label, index) => {
        const pts = series.map((snap) => {
          const row = snap.accounts.get(label);
          return row ? { x: snap.t, y: row.pnl } : null;
        }).filter(Boolean);
        if (pts.length >= 2) add("path", { d: pathFor(pts, xFor, yFor), class: "series", stroke: colors[index % colors.length] });
      });
      const totalPts = series.map((snap) => ({ x: snap.t, y: snap.total }));
      if (totalPts.length >= 2) add("path", { d: pathFor(totalPts, xFor, yFor), class: "series total", stroke: colors[11] });
      add("text", { x: left, y: 22, "font-weight": "700" }).textContent = "PnL (USDC)";
    }

    function renderLegend(latest) {
      const labels = (latest?.accounts || []).map((row) => row.label);
      document.getElementById("legend").innerHTML = [
        ...labels.map((label, index) => `<span class="legend-item"><span class="swatch" style="background:${colors[index % colors.length]}"></span>${label}</span>`),
        `<span class="legend-item"><span class="swatch" style="background:${colors[11]};height:5px"></span>total</span>`
      ].join("");
    }

    function renderStats(latest, history) {
      const s = latest?.summary || {};
      document.getElementById("stats").innerHTML = [
        ["总净资产", fmtMoney(s.totalEquity)],
        ["总盈亏", `<span class="${cls(s.totalPnl)}">${fmtSigned(s.totalPnl)}</span>`],
        ["收益率", `<span class="${cls(s.totalPnl)}">${Number(s.totalPnlPct || 0).toFixed(2)}%</span>`],
        ["快照数量", String(history.length)]
      ].map(([k, v]) => `<div class="stat"><span>${k}</span><strong>${v}</strong></div>`).join("");
    }

    function renderTable(latest) {
      const rows = latest?.accounts || [];
      document.getElementById("latestTable").innerHTML = `
        <thead><tr><th>账号</th><th>净资产</th><th>本金</th><th>盈亏</th><th>现金</th><th>持仓估值</th><th>持仓数</th></tr></thead>
        <tbody>${rows.map((row) => `
          <tr>
            <td>${row.label}</td>
            <td>${fmtMoney(row.equity)}</td>
            <td>${fmtMoney(row.principal)}</td>
            <td class="${cls(row.pnl)}">${fmtSigned(row.pnl)}</td>
            <td>${fmtMoney(row.cash)}</td>
            <td>${fmtMoney(row.openValue)}</td>
            <td>${row.positionsCount}</td>
          </tr>`).join("")}</tbody>`;
    }

    fetch("./data/equity-history.json", { cache: "no-store" })
      .then((res) => res.json())
      .then((data) => {
        const history = data.history || [];
        const latest = data.latest || history[history.length - 1] || null;
        document.getElementById("meta").textContent = latest
          ? `最后更新：${bjTime(latest.capturedAt)}，数据源：Polymarket accounting snapshot`
          : "暂无快照，等待 GitHub Actions 首次采样。";
        renderStats(latest, history);
        renderChart(history);
        renderLegend(latest);
        renderTable(latest);
      })
      .catch((error) => {
        document.getElementById("meta").textContent = `加载失败：${error.message}`;
      });
  </script>
</body>
</html>
